<div class="post-separator"></div>
<div>
  <h2>Comments</h2>
  <div id="post-comments">
    <div id="comment-loading-placeholder">
      <img id="comment-loading-logo" alt="comment-loading-spinner" src="/sierpinski_logo.svg" />
    </div>
  </div>
</div>
<script>
  const host = "{{ .context.Site.Params.MastodonHost }}";
  const id = "{{ .mastodonPostID }}";
  const commentSection = document.getElementById("post-comments");
  const commentNestingColors = ["red", "green", "turquoise"];

  function render_toots(toots, in_reply_to, depth) {
    var tootsToRender = toots
      .filter((toot) => toot.in_reply_to_id === in_reply_to)
      .sort((a, b) => a.created_at.localeCompare(b.created_at));

    if (depth == 0) {
      let info = document.createElement("div");
      info.classList = ["comment-help"]
      let help = document.createElement("div");
      help.innerHTML = `
        <span>Leave a comment on this <a href="https://${host}/@campfireman/${id}">Mastodon post</a> for it to show up here.</span>
      `;
      info.appendChild(help);
      if (tootsToRender.length == 0) {
        let noComments = document.createElement("div");
        noComments.classList = ["comment-empty"]
        noComments.innerHTML = `
        <code>(＞﹏＜)</code><span> No comments yet!</span>
      `;
        info.appendChild(noComments);
      }
      commentSection.appendChild(info);
    }
    tootsToRender.forEach((toot) => render_toot(toots, toot, depth));
  }

  function render_toot(toots, toot, depth) {
    let comment = document.createElement("div");
    comment.classList.add("comment");
    comment.style.borderColor = `var(--${commentNestingColors[depth % commentNestingColors.length]
      })`;
    comment.style.marginLeft = `calc(var(--comment-indentation) * ${depth})`;
    comment.innerHTML = `
      <a class="comment-user-link" href="${toot.account.url}">
        <div class="comment-user-info">
          <img src="${toot.account.avatar}" alt="mastodon-${toot.account.username}-avatar-image" class="comment-avatar" />
          <div class="comment-name-section">
            <div class="comment-username">
              ${toot.account.username}
            </div>
            <div class="comment-user-fqn">
              @${toot.account.acct}
            </div>
          </div>
        </div>
      </a>
      <div class="comment-content">
        ${toot.content}
      </div>
      <div class="comment-actions">
        <a href="${toot.url}" class="comment-reply">
            <img src="/mastodon_icon_reply.svg" alt="mastodon-reply" />
            <span>${toot.replies_count}</span>
        </a>
        <a href="${toot.url}" class="comment-boost">
            <img src="/mastodon_icon_boost.svg" alt="mastodon-boost" />
            <span>${toot.reblogs_count}</span>
        </a>
        <a href="${toot.url}" class="comment-star">
            <img src="/mastodon_icon_star.svg" alt="mastodon-star" />
            <span>${toot.favourites_count}</span>
        </a>
      </div>`;
    console.log(toot);
    commentSection.appendChild(comment);
    render_toots(toots, toot.id, depth + 1);
  }

  function loadComments() {
    fetch("https://" + host + "/api/v1/statuses/" + id + "/context")
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        if (!data["descendants"]) {
          commentSection.innerHTML = "No comments found.";
          return;
        }
        commentSection.innerHTML = "";
        render_toots(data["descendants"], id, 0);
      });
  }
  loadComments();
</script>
